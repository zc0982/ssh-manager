<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232f6fed'/><text x='3' y='12' font-size='10' fill='white' font-family='monospace'>&gt;_</text></svg>">
<link rel="stylesheet" href="/client/style.css">
</head>
<body>
<header class="top">
  <div class="brand">SSH Manager</div>
  <div id="status" class="status"></div>
  <div class="actions">
    <button id="btn-keys" class="ghost">密钥</button>
    <button id="btn-import" class="ghost">从本机导入</button>
    <button id="btn-pull" class="ghost">全部同步到本机</button>
    <button id="btn-add" class="primary">新增服务器</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <input id="search" type="search" placeholder="搜索别名 / 主机 / 标签 / 备注">
    <div id="env-filter" class="chips"></div>
    <ul id="server-list" class="server-list"></ul>
  </aside>
  <section id="detail" class="detail">
    <div class="empty">选择左侧服务器，或点击「新增服务器」</div>
  </section>
</main>

<dialog id="server-dialog">
  <form id="server-form" method="dialog">
    <h2 id="form-title">新增服务器</h2>
    <div class="grid">
      <label>别名<input name="alias" required pattern="[A-Za-z0-9._\-]+" placeholder="prod-web-01"></label>
      <label>环境
        <select name="environment">
          <option value="development">development</option>
          <option value="staging">staging</option>
          <option value="production">production</option>
        </select>
      </label>
      <label>主机<input name="hostname" required placeholder="192.168.1.10"></label>
      <label>端口<input name="port" type="number" min="1" max="65535" value="22"></label>
      <label>用户名<input name="username" required value="root"></label>
      <label>跳板机别名<input name="proxy_jump" placeholder="可选"></label>
      <label>认证方式
        <select name="auth_type">
          <option value="key">密钥</option>
          <option value="password">密码</option>
        </select>
      </label>
      <label data-auth="key">密钥
        <select name="key_id"><option value="">使用本机密钥文件路径</option></select>
      </label>
      <label data-auth="key" id="identity-file-label">本机密钥文件路径<input name="identity_file" placeholder="~/.ssh/id_ed25519"></label>
      <label data-auth="password">密码<input name="password" type="password" autocomplete="new-password"></label>
      <label>标签<input name="tags" placeholder="web, nginx（逗号分隔）"></label>
      <label>位置<input name="location" placeholder="阿里云-北京"></label>
      <label class="full">备注<input name="description"></label>
    </div>
    <p class="hint" data-auth="password">密码在浏览器里用本机 agent 的公钥加密后才上传，云端和 Worker 都看不到明文；编辑时留空表示不修改。</p>
    <p class="error" id="form-error"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" data-close>取消</button>
      <button type="submit" class="primary">保存并同步</button>
    </div>
  </form>
</dialog>

<dialog id="import-dialog">
  <form method="dialog">
    <h2>从本机 ~/.ssh/config 导入到云端</h2>
    <div id="import-list" class="import-list"></div>
    <label class="check"><input type="checkbox" id="import-upload-keys" checked> 同时把这些主机使用的私钥文件加密上传到云端</label>
    <div class="dialog-actions">
      <button type="button" class="ghost" data-close>取消</button>
      <button type="button" class="primary" id="btn-do-import">导入所选</button>
    </div>
  </form>
</dialog>

<dialog id="keys-dialog">
  <form method="dialog">
    <h2>云端 SSH 密钥</h2>
    <p class="hint">私钥在浏览器里用本机 agent 的公钥加密后才上传，云端只保存密文。同步时由 agent 解密写到 <code>~/.ssh/ssh-manager/&lt;名称&gt;.key</code>（权限 600）。暂不支持带口令的私钥。</p>
    <div id="keys-list" class="table-wrap"></div>
    <h3>上传私钥</h3>
    <div class="grid">
      <label>名称<input id="key-name" pattern="[A-Za-z0-9._\-]+" placeholder="prod-deploy"></label>
      <label>说明<input id="key-comment" placeholder="可选"></label>
      <label class="full">私钥文件<input id="key-file" type="file"></label>
      <label class="full">或直接粘贴<textarea id="key-text" rows="5" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
    </div>
    <p class="error" id="key-error"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" data-close>关闭</button>
      <button type="button" class="primary" id="btn-key-upload">加密并上传</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>
<script type="module" src="/client/app.js"></script>
</body>
</html>
